name: Android APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0

    - name: Download Godot Editor
      run: |
        GODOT_VERSION="4.2.1"
        GODOT_URL="https://github.com/godotengine/godot/releases/download/\( {GODOT_VERSION}-stable/Godot_v \){GODOT_VERSION}-stable_linux.x86_64.zip"
        wget -q ${GODOT_URL}
        unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
        chmod +x godot

    - name: Download Godot Export Templates
      run: |
        GODOT_VERSION="4.2.1"
        wget -q https://github.com/godotengine/godot/releases/download/\( {GODOT_VERSION}-stable/Godot_v \){GODOT_VERSION}-stable_export_templates.tpz
        mkdir -p \~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
        unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
        mv templates/* \~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
        rm -rf templates Godot_v${GODOT_VERSION}-stable_export_templates.tpz

    - name: Create Debug Keystore
      run: |
        keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

    - name: Patch export_presets.cfg with keystore paths
      run: |
        sed -i 's|keystore/debug=""|keystore/debug="'"$GITHUB_WORKSPACE"'/debug.keystore"|' export_presets.cfg
        sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
        sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg
        sed -i 's|keystore/release=""|keystore/release="'"$GITHUB_WORKSPACE"'/debug.keystore"|' export_presets.cfg
        sed -i 's|keystore/release_user=""|keystore/release_user="androiddebugkey"|' export_presets.cfg
        sed -i 's|keystore/release_password=""|keystore/release_password="android"|' export_presets.cfg
        echo "=== Patched export_presets.cfg ==="
        cat export_presets.cfg

    - name: Export Android APK
      run: |
        mkdir -p build/android
        ./godot --headless --editor --quit --set-setting "export/android/android_sdk_path" "$ANDROID_HOME"
        ./godot --headless --export-debug "Android" build/android/game.apk --verbose

    - name: Verify APK created
      run: |
        ls -la build/android/
        if [ ! -f build/android/game.apk ]; then
          echo "APK FILE NOT FOUND! Export failed."
          exit 1
        fi
        echo "APK created successfully! Size: $(du -h build/android/game.apk | cut -f1)"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: build/android/game.apk
